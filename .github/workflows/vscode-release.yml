name: Release VS Code extension

# 打 vscode-v* 标签即发布 packages/vscode: 校验 -> 打包 vsix -> 创建 GitHub Release 并附带 vsix -> 发布到两个市场.
# 手动触发用于补发某个已存在的版本(不重新打标签).
#
# 由 vsc-ext 骨架的 release.yml 改写为 monorepo 版本(见 packages/vscode/.template-shared 的 ! 行):
# GitHub 只读仓库根的 .github; 包管理器是 pnpm; 插件构建依赖其他 workspace 包的 dist, 所以先在仓库根 pnpm build;
# 标签带 vscode- 前缀, 与仓库内其他包的发布互不冲突. 版本, 包名与产物路径全部从 packages/vscode/package.json 推导,
# 校验内容由该目录的 `pnpm run check` 决定.
on:
  push:
    tags:
      - 'vscode-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'packages/vscode/package.json 中的版本号, 例如 0.1.0'
        required: true

# 顶层给只读, 写权限只下沉到真正要创建 Release 的那个 job.
permissions:
  contents: read

env:
  EXT_DIR: packages/vscode

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      vsix: ${{ steps.version.outputs.vsix }}
      vsix_name: ${{ steps.version.outputs.vsix_name }}
      has_vsce_pat: ${{ steps.secrets.outputs.has_vsce_pat }}
      has_ovsx_pat: ${{ steps.secrets.outputs.has_ovsx_pat }}
    steps:
      - uses: actions/checkout@v7

      # pnpm 版本取仓库根 package.json 的 packageManager. 必须在 setup-node 之前:
      # cache: pnpm 需要 pnpm 已在 PATH 上才能算出 store 路径.
      - uses: pnpm/action-setup@v4

      # node 版本取插件目录的 .nvmrc, 与插件 engines.node 下限同源.
      - uses: actions/setup-node@v7
        with:
          node-version-file: packages/vscode/.nvmrc
          cache: pnpm

      # --frozen-lockfile: lockfile 缺失或与 package.json 不一致时报错退出, 不按 semver range 重新解析;
      # 打标签即发布到市场, 发出去的 vsix 必须是 lockfile 锁定的那一份依赖.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ${{ }} 一律先落到 env 再在脚本里引用: workflow_dispatch 的 inputs 是外部可填的, 直接插值等于拼进 shell 源码.
      - name: Resolve and verify version
        id: version
        working-directory: ${{ env.EXT_DIR }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          pkg_name="$(node -p "require('./package.json').name")"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            input_version="$INPUT_VERSION"
          else
            input_version="${GITHUB_REF_NAME#vscode-v}"
          fi
          if [ "$pkg_version" != "$input_version" ]; then
            echo "::error::版本不一致: package.json=$pkg_version, 触发版本=$input_version"
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          echo "vsix_name=$pkg_name-$pkg_version.vsix" >> "$GITHUB_OUTPUT"
          echo "vsix=$EXT_DIR/artifacts/$pkg_name-$pkg_version.vsix" >> "$GITHUB_OUTPUT"

      # 插件构建读取 @jotl/language-server, @jotl/form 等包的 dist.
      - name: Build workspace
        run: pnpm build

      # 图标产物, 清单占位符, 本地化与骨架漂移; 漏了不会让构建失败, 只会静默出错.
      - name: Check consistency
        working-directory: ${{ env.EXT_DIR }}
        run: pnpm run check

      - name: Typecheck
        working-directory: ${{ env.EXT_DIR }}
        run: pnpm run typecheck

      - name: Test
        working-directory: ${{ env.EXT_DIR }}
        run: pnpm test

      # package 脚本内部触发 vscode:prepublish 做生产构建, 并按允许清单断言 VSIX 内容.
      - name: Package extension
        working-directory: ${{ env.EXT_DIR }}
        run: pnpm run package

      # 取 CHANGELOG 中与本版本对应的小节作为 Release 说明; 缺失时只告警, 不阻断发布.
      - name: Extract release notes
        working-directory: ${{ env.EXT_DIR }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if node scripts/changelog-section.mjs "$VERSION" > "$GITHUB_WORKSPACE/RELEASE_NOTES.md"; then
            cat "$GITHUB_WORKSPACE/RELEASE_NOTES.md"
          else
            echo "::warning::CHANGELOG.md 中未找到 $VERSION 的小节, Release 说明为空"
            : > "$GITHUB_WORKSPACE/RELEASE_NOTES.md"
          fi

      # 与本文件其余 action 一样只钉大版本, 不钉 commit SHA.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: VS Code extension v${{ steps.version.outputs.version }}
          tag_name: vscode-v${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
          files: ${{ steps.version.outputs.vsix }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.vsix_name }}
          path: ${{ steps.version.outputs.vsix }}

      # secrets 上下文在 job 级 if 中不可用, 因此在这里转成 job output 供下游判断.
      - name: Check marketplace credentials
        id: secrets
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          [ -n "$VSCE_PAT" ] && echo "has_vsce_pat=true" >> "$GITHUB_OUTPUT" || echo "has_vsce_pat=false" >> "$GITHUB_OUTPUT"
          [ -n "$OVSX_PAT" ] && echo "has_ovsx_pat=true" >> "$GITHUB_OUTPUT" || echo "has_ovsx_pat=false" >> "$GITHUB_OUTPUT"

  # 仅在仓库配置了 VSCE_PAT 后运行; 用 --packagePath 发布 release job 已校验的那个 vsix, 不重新构建.
  # 预发布标记已由打包时的 --pre-release 写进 vsix, 发布时沿用.
  marketplace:
    needs: release
    if: needs.release.outputs.has_vsce_pat == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: packages/vscode/.nvmrc
          cache: pnpm

      # 只为拿到 vsce 可执行文件; 打包已在 release job 完成, 所以只装插件目录的依赖.
      - run: pnpm install --frozen-lockfile --filter ./packages/vscode

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release.outputs.vsix_name }}

      - name: Publish to VS Code Marketplace
        working-directory: ${{ env.EXT_DIR }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX_NAME: ${{ needs.release.outputs.vsix_name }}
        run: pnpm exec vsce publish --packagePath "$GITHUB_WORKSPACE/$VSIX_NAME"

  # Open VSX(VSCodium / Cursor / Windsurf 等非官方发行版的市场), 同样按 secret 存在与否开关.
  open-vsx:
    needs: release
    if: needs.release.outputs.has_ovsx_pat == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: packages/vscode/.nvmrc

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.release.outputs.vsix_name }}

      # ovsx 不进 devDependencies, 这个 job 也不装依赖: 它只在配了 OVSX_PAT 时才用到.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX_NAME: ${{ needs.release.outputs.vsix_name }}
        run: npx --yes ovsx publish "$VSIX_NAME"
