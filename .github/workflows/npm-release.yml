# 推送 <包目录名>@<版本> 形式的 tag 时发布 packages/<包目录名>, 例: core@0.0.2, cli@0.0.2
# npm 登录走 Trusted Publishing(OIDC), 不需要 NPM_TOKEN; 各包需先登记本仓库与本文件, 批量登记见 docs/development.md
# build 执行依赖代码但只有只读权限, publish 只拿 OIDC 且不执行依赖代码
# npm 上已有的版本会跳过, 因此补推已手动发布版本的 tag 或重跑失败的运行都安全
name: Release npm package
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['*@*']

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # 查询 CI 结果
      contents: read
    outputs:
      name: ${{ steps.pkg.outputs.name }}
      version: ${{ steps.pkg.outputs.version }}
      dist_tag: ${{ steps.pkg.outputs.dist_tag }}
      skip: ${{ steps.pkg.outputs.skip }}
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # 从 tag 解析包目录与版本, 与 package.json 的 version 不一致时直接失败
      - name: Resolve package
        id: pkg
        run: |
          dir="${TAG%@*}"
          version="${TAG##*@}"
          if [ ! -f "packages/$dir/package.json" ]; then
            echo "::error::packages/$dir 不存在"
            exit 1
          fi
          read -r private actual name < <(node -p "const p=require('./packages/$dir/package.json'); [p.private===true, p.version, p.name].join(' ')")
          if [ "$private" = true ]; then
            echo "::error::packages/$dir 是 private 包, 不发布"
            exit 1
          fi
          if [ "$actual" != "$version" ]; then
            echo "::error::tag 版本 $version 与 packages/$dir/package.json 的 $actual 不一致"
            exit 1
          fi
          skip=false
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version 已在 npm 上, 跳过发布"
            skip=true
          fi
          # 带预发布后缀(例: 0.0.2-beta.1)的版本发布到 next, 不覆盖 latest
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          {
            echo "dir=$dir"
            echo "name=$name"
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

      # 不重复跑检查: 等待同一提交在 main 上的 CI 结束, 通过才发布
      - name: Wait for CI
        if: steps.pkg.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$SECONDS
          while :; do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "missing" else "\(.status)/\(.conclusion // "")" end')"
            case "$state" in
              completed/success) echo "CI 已通过"; exit 0 ;;
              completed/*) echo "::error::CI 未通过($state), 不发布"; exit 1 ;;
              missing)
                if [ $((SECONDS - started)) -gt 300 ]; then
                  echo "::error::提交 $GITHUB_SHA 没有 CI 运行记录, 先把它推送到 main"
                  exit 1
                fi ;;
            esac
            echo "CI 状态: $state, 30 秒后重试"
            sleep 30
          done

      # pnpm 版本取仓库根 package.json 的 packageManager; 必须在 setup-node 之前, cache: pnpm 需要 pnpm 已在 PATH 上.
      - uses: pnpm/action-setup@v4
        if: steps.pkg.outputs.skip != 'true'

      - uses: actions/setup-node@v7
        if: steps.pkg.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm

      # pnpm pack 把 workspace: 依赖换成各依赖包当前的版本
      - name: Build and pack
        if: steps.pkg.outputs.skip != 'true'
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p "$RUNNER_TEMP/pack"
          (cd "packages/$DIR" && pnpm pack --pack-destination "$RUNNER_TEMP/pack")
          if tar -xzOf "$RUNNER_TEMP"/pack/*.tgz package/package.json | grep -q '"workspace:'; then
            echo "::error::包中仍有 workspace: 依赖"
            exit 1
          fi
          ls -l "$RUNNER_TEMP/pack"

      # 按多数用户的安装方式验证包能装能用: 在空目录用 npm 安装 tarball, 导入入口, 带 bin 的再跑一次 --version.
      # @jotl/* 依赖从 npm 安装, 须已发布(按依赖顺序推 tag); peerDependencies 全部显式安装(含可选的, 例: @jotl/form 主入口要 react),
      # 取声明范围内的最新版; 不执行依赖的安装脚本.
      - name: Smoke test with npm install
        if: steps.pkg.outputs.skip != 'true'
        env:
          NAME: ${{ steps.pkg.outputs.name }}
        run: |
          dir="$RUNNER_TEMP/smoke"
          mkdir -p "$dir"
          cd "$dir"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz
          node -e '
            const peers = require(`./node_modules/${process.env.NAME}/package.json`).peerDependencies ?? {};
            const specs = Object.entries(peers).map(([name, range]) => `${name}@${range}`);
            if (specs.length) require("node:child_process").execFileSync("npm", ["install", "--ignore-scripts", "--no-audit", "--no-fund", ...specs], { stdio: "inherit" });
          '
          node --input-type=module -e 'await import(process.env.NAME); console.log(`导入成功: ${process.env.NAME}`)'
          for bin in $(node -p "Object.keys(require('./node_modules/$NAME/package.json').bin ?? {}).join(' ')"); do
            npm exec --no -- "$bin" --version
          done

      - uses: actions/upload-artifact@v7
        if: steps.pkg.outputs.skip != 'true'
        with:
          name: package
          path: ${{ runner.temp }}/pack/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # npm Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: pack
      # Trusted Publishing 需要 npm >= 11.5.1 与 Node >= 22.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # 钉死版本, 发布工具也由提交锁定; 升级时改这一处
      - run: npm i -g npm@11.21.1
      # 只发布 build 产出的 tarball, 不安装依赖也不执行任何脚本
      # 必须带 ./: 写成 pack/x.tgz 会被 npm 当成 GitHub 简写 <用户>/<仓库> 去 git 拉取
      # OIDC 换取 npm token 失败时 npm 只在 verbose 级别记录原因, 随后匿名上传得到 404; 开 verbose 以便排查
      - name: Publish
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm publish ./pack/*.tgz --provenance --access public --tag "${{ needs.build.outputs.dist_tag }}"
