name: CI

# 推送与合并请求时跑全仓检查: 构建, 测试类型检查, 全部测试, Playground 构建, lint, @jotl/form 的 React 16.8-19 兼容测试, VS Code 插件包内测试.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # pnpm 版本取仓库根 package.json 的 packageManager; 必须在 setup-node 之前, cache: pnpm 需要 pnpm 已在 PATH 上.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # vendor/ 不入库; convert 与 data 的测试缺它即失败.
      - name: Fetch JSON-Schema-Test-Suite
        run: bash scripts/fetch-json-schema-test-suite.sh

      - name: Check
        run: pnpm check

      - name: React compatibility (16.8, 17, 18, 19)
        run: pnpm --filter @jotl/form run test:react-compat

      - name: VS Code extension tests
        working-directory: packages/vscode
        run: pnpm exec vitest run
